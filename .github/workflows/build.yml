name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to apk branch
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/jarvis.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk
          git rm -rf . >/dev/null
          cp /tmp/out/jarvis.apk .
          git add jarvis.apk
          git commit -m "APK build"
          git push -f origin apk
