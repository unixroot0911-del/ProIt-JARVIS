name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
      - name: Publish APK and build log to branches
        if: always()
        shell: bash
        env:
          GH_TOKEN_X: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish() {
            branch="$1"; shift
            d=$(mktemp -d)
            for f in "$@"; do cp "$f" "$d/"; done
            cd "$d"
            git init -q
            git checkout -q -b "$branch"
            git add -A
            git -c user.name=actions -c user.email=actions@github.com commit -q -m "$branch"
            git remote add origin "https://x-access-token:${GH_TOKEN_X}@github.com/${GITHUB_REPOSITORY}.git"
            git push -q -f origin "$branch"
            cd "$GITHUB_WORKSPACE"
          }
          [ -f build.log ] && tail -n 400 build.log > "$RUNNER_TEMP/build.log" && publish buildlog "$RUNNER_TEMP/build.log"
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            cp "$APK" "$RUNNER_TEMP/jarvis.apk"
            grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts > "$RUNNER_TEMP/version.txt"
            publish apk "$RUNNER_TEMP/jarvis.apk" "$RUNNER_TEMP/version.txt"
          fi
